###############################################################################
# Render Blueprint — WexaAI Backend
# Docs: https://render.com/docs/blueprint-spec
#
# Deploys: PostgreSQL, Redis (keyvalue), API (web), Celery worker, Celery beat.
# (Flower omitted — Render single-port limit makes it awkward; run locally.)
###############################################################################

databases:
  - name: wexaai-postgres
    plan: free            # bump to "starter" or higher for production
    databaseName: wexaai
    user: wexaai
    postgresMajorVersion: "16"

services:
  # ── Redis (Render KeyValue) ───────────────────────────────────────────────
  - type: keyvalue
    name: wexaai-redis
    plan: free            # 25 MB; use "starter" or higher for production
    region: oregon
    ipAllowList: []       # internal access only

  # ── API (FastAPI / Uvicorn) ───────────────────────────────────────────────
  - type: web
    name: wexaai-api
    runtime: docker
    plan: starter          # web services have no free tier with custom Docker
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    preDeployCommand: alembic upgrade head
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: PORT
        value: "8000"
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: DATABASE_URL
        fromDatabase:
          name: wexaai-postgres
          property: connectionString
      - key: DATABASE_SYNC_URL
        fromDatabase:
          name: wexaai-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: wexaai-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: wexaai-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: wexaai-redis
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false        # set in Render UI: https://your-app.vercel.app
      - key: FRONTEND_URL
        sync: false        # set in Render UI
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: noreply@wexaai.com
      - key: SMTP_TLS
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: INGESTION_RATE_LIMIT_PER_MINUTE
        value: "1000"
      - key: MAX_UPLOAD_SIZE_MB
        value: "50"

  # ── Celery Worker (background jobs) ───────────────────────────────────────
  - type: worker
    name: wexaai-worker
    runtime: docker
    plan: starter
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    dockerCommand: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        fromService:
          type: web
          name: wexaai-api
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: wexaai-postgres
          property: connectionString
      - key: DATABASE_SYNC_URL
        fromDatabase:
          name: wexaai-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: wexaai-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: wexaai-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: wexaai-redis
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

  # ── Celery Beat (scheduler) ───────────────────────────────────────────────
  - type: worker
    name: wexaai-beat
    runtime: docker
    plan: starter
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    dockerCommand: celery -A app.tasks.celery_app beat --loglevel=info
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        fromService:
          type: web
          name: wexaai-api
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: wexaai-postgres
          property: connectionString
      - key: DATABASE_SYNC_URL
        fromDatabase:
          name: wexaai-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: wexaai-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: wexaai-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: wexaai-redis
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
